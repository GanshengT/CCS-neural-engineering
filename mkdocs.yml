site_name: CCS Neural Engineering
site_description: Scientific illustration and analysis package for neural engineering
site_url: https://GanshengT.github.io/CCS-neural-engineering
repo_url: https://github.com/GanshengT/CCS-neural-engineering
repo_name: CCS-neural-engineering

nav:
  - Home: index.md
  - Installation: installation.md
  - API:
      - Overview: api/index.md
      - Illustration:
          - Distributions: api/illustration/distributions.md
          - Circular: api/illustration/circular.md
          - Export: api/illustration/export.md
  - Tutorial: tutorials/polarity_tutorial.ipynb

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true
