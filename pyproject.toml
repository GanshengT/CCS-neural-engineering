[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-neural-engineering"
version = "0.1.0"
description = "Scientific analysis and illustration tools for neural engineering workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CCS Neural Engineering" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "plotly>=5.18",
  "scipy>=1.10",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings>=0.26",
  "mkdocstrings-python>=1.12",
  "mkdocs-jupyter>=0.25",
]
export = [
  "kaleido>=0.2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
