[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-neural-engineering"
version = "0.1.0"
description = "Scientific analysis and illustration tools for neural engineering workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CCS Neural Engineering" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "plotly>=5.18",
  "scipy>=1.10",
  "statsmodels>=0.14"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
